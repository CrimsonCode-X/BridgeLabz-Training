<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
  <header><h1>Responsive Image Filter Gallery</h1></header>
  <main class="gallery">
    <figure class="filter blur"><img src="https://picsum.photos/seed/q1a/600/400" alt="Landscape"><figcaption>Blur</figcaption></figure>
    <figure class="filter grayscale"><img src="https://picsum.photos/seed/q1b/600/400" alt="Nature"><figcaption>Grayscale</figcaption></figure>
    <figure class="filter sepia"><img src="https://picsum.photos/seed/q1c/600/400" alt="Architecture"><figcaption>Sepia</figcaption></figure>
    <figure class="filter brightness"><img src="https://picsum.photos/seed/q1d/600/400" alt="Road"><figcaption>Brightness</figcaption></figure>
    <figure class="filter contrast"><img src="https://picsum.photos/seed/q1e/600/400" alt="Forest"><figcaption>Contrast</figcaption></figure>
    <figure class="filter hue"><img src="https://picsum.photos/seed/q1f/600/400" alt="Ocean"><figcaption>Hue-Rotate</figcaption></figure>
  </main>
</body>
</html>
