<!DOCTYPE html>

    <title>Aman Goswami - Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 300px;
            padding: 25px;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 14px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .degree {
            margin-top: 4px;
            font-size: 14px;
        }

        .college {
            margin-top: 3px;
            color: #777;
            font-size: 12px;
        }

        .bio {
            margin: 18px 0 12px;
            color: #777;
            font-size: 12px;
            line-height: 1.7;
        }

        h3 {
            margin: 8px 0;
            font-size: 14px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skills a {
            color: #628ce8;
            font-size: 12px;
        }

        .contact {
            display: inline-block;
            margin-top: 15px;
            padding: 9px 18px;
            background: #2865e8;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .contact:hover {
            background: #1d54c7;
        }
    </style>
</head>
