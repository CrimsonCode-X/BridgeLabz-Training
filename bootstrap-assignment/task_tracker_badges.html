<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevBoard | Task Tracker</title>
<!-- Bootstrap 5 CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="task_tracker_badges.css">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3"><div class="container d-flex justify-content-between align-items-center">
  <h1 class="h4 mb-0">Sprint Tasks</h1>
  <!-- badge shows the total pending tasks -->
  <span class="fs-6">Pending <span class="badge bg-warning text-dark rounded-pill">5</span></span></div></header>
<main class="container py-4"><ul class="list-group shadow-sm task-list">
  <li class="list-group-item d-flex justify-content-between align-items-center">Fix login form validation bug<span class="badge bg-danger">High</span></li>
  <li class="list-group-item d-flex justify-content-between align-items-center">Deploy staging build to server<span class="badge bg-danger">High</span></li>
  <li class="list-group-item d-flex justify-content-between align-items-center">Write API documentation<span class="badge bg-warning text-dark">Medium</span></li>
  <li class="list-group-item d-flex justify-content-between align-items-center">Refactor dashboard components<span class="badge bg-warning text-dark">Medium</span></li>
  <li class="list-group-item d-flex justify-content-between align-items-center">Update footer links<span class="badge bg-success">Low</span></li>
</ul>
<!-- button with an embedded badge -->
<button class="btn btn-success mt-3">Completed <span class="badge text-bg-light">12</span></button></main>
</body></html>
