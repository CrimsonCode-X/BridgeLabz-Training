<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aman Goswami | Web Developer Portfolio</title>
<!-- Bootstrap 5 CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="personal_portfolio_basics.css">
</head>
<body class="bg-light text-dark">
<header class="text-center p-5 bg-white border-bottom">
  <h1 class="fw-bold">Aman Goswami</h1>
  <p class="lead mb-0">Front-end developer building fast, responsive websites</p>
</header>
<!-- container + text-center align everything; mt-4/mb-3/p-5 are spacing utilities -->
<main class="container text-center mt-4">
  <section class="mb-3">
    <img src="https://picsum.photos/seed/aman/300/300" alt="Aman Goswami profile photo" class="img-fluid rounded-circle profile mb-3">
    <p class="mx-auto about">B.Tech student in Mathura who enjoys HTML, CSS, Bootstrap and JavaScript. I have built a library portal and a college event site.</p>
    <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
    <a href="#" class="btn btn-outline-dark">Download CV</a>
  </section>
  <section id="contact" class="p-5 mt-4 mb-3 bg-white rounded shadow-sm mx-auto form-box">
    <h2 class="fw-bold mb-3">Contact Me</h2>
    <form class="text-start">
      <input type="text" class="form-control mb-3" placeholder="Your name">
      <input type="email" class="form-control mb-3" placeholder="Email address">
      <textarea class="form-control mb-3" rows="3" placeholder="Your message"></textarea>
      <button type="button" class="btn btn-dark w-100">Send Message</button>
    </form>
  </section>
</main>
<footer class="text-center text-muted py-3"><small>&copy; 2026 Aman Goswami</small></footer>
</body></html>
