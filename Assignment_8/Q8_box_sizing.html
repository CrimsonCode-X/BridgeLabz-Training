<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing Comparison</title><link rel="stylesheet" href="Q8_box_sizing.css">
</head>
<body>
  <main>
    <h1>Box-Sizing Comparison</h1>
    <section class="comparison">
      <article class="box content-box"><h2>content-box</h2><p>Width applies to content. Padding and border are added to the total size.</p></article>
      <article class="box border-box"><h2>border-box</h2><p>Width includes content, padding, and border, keeping the declared width fixed.</p></article>
    </section>
    <p class="note">Both boxes use the same declared width, padding, and border.</p>
  </main>
</body>
</html>
