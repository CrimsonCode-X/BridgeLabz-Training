<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface</title><link rel="stylesheet" href="Q10_mini_ui.css">
</head>
<body>
  <header><h1>Student Profile</h1></header>
  <main>
    <section class="card">
      <img src="https://picsum.photos/seed/student/180/180" alt="Decorative profile image">
      <div class="content">
        <h2>Contact Form</h2>
        <form>
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Enter your name">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email">
          <label for="message">Message</label>
          <textarea id="message" rows="4" placeholder="Write a message"></textarea>
          <div class="form-actions"><button type="submit">Submit</button><button type="reset" class="reset">Reset</button></div>
        </form>
      </div>
    </section>
  </main>
  <footer>Mini UI Layout • HTML & CSS</footer>
</body>
</html>
