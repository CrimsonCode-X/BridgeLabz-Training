<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title><link rel="stylesheet" href="Q7_ui_components.css">
</head>
<body>
  <main class="ui-card">
    <h1>Simple User Interface</h1>
    <label for="search">Search</label>
    <input id="search" type="search" placeholder="Search here...">
    <div class="actions">
      <button>Search</button>
      <button class="secondary">Clear</button>
    </div>
    <label for="category">Choose category</label>
    <select id="category"><option>Web Design</option><option>Programming</option><option>Database</option></select>
  </main>
</body>
</html>
